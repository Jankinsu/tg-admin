name: Phase 1 tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Validate deploy scripts syntax
        run: bash -n scripts/install.sh scripts/uninstall.sh
      - name: Compile Python sources
        run: python -m compileall -q src runner.py tests
      - name: Run unit tests
        run: python -m pytest -q
